<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>GraRec 管理画面</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f5f8fc; font-size: 13px; }
    header {
      background: #1A3A5C; color: white;
      padding: 0 24px; height: 52px;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 18px; margin: 0; }
    header span { font-size: 12px; opacity: 0.7; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    h2 { font-size: 15px; color: #333; margin-bottom: 12px; }
    #status { font-size: 13px; color: #888; margin-bottom: 10px; }

    table {
      width: 100%; border-collapse: collapse;
      background: white; border-radius: 10px;
      overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    thead { background: #1A3A5C; color: white; }
    th { padding: 9px 12px; text-align: left; font-weight: 600; font-size: 12px; }
    td { padding: 9px 12px; border-bottom: 1px solid #eef0f4; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tbody tr.data-row:hover td { background: #f5f8ff; cursor: pointer; }

    /* 詳細行 */
    tr.detail-row td { background: #fafbff; padding: 0; border-bottom: 2px solid #dde3f0; }
    .detail-panel {
      padding: 14px 20px; display: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }
    .detail-panel.open { display: grid; }
    .detail-block { background: white; border-radius: 8px; padding: 12px 14px;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .detail-block h4 { font-size: 12px; color: #1A3A5C; font-weight: 700;
                        margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; }

    /* バッジ */
    .badge { display: inline-block; padding: 2px 8px;
              border-radius: 12px; font-size: 11px; font-weight: bold; }
    .badge-group { background: #e3f0ff; color: #1A5CB5; }
    .badge-phase { background: #fff3e0; color: #b55a00; }

    /* 発話バー */
    .spk-bar { display: flex; gap: 2px; height: 6px; margin-top: 4px; border-radius: 3px; overflow: hidden; }
    .spk-seg  { height: 100%; }

    /* ミニバー（エリア分布・タイムライン） */
    .mini-bar-row  { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    .mini-bar-label { font-size: 11px; color: #555; min-width: 90px; white-space: nowrap;
                       overflow: hidden; text-overflow: ellipsis; }
    .mini-bar-track { flex: 1; background: #e8edf4; border-radius: 3px; height: 10px; overflow: hidden; }
    .mini-bar-fill  { height: 100%; border-radius: 3px; background: #4A90D9; }
    .mini-bar-num   { font-size: 11px; color: #888; min-width: 24px; text-align: right; }

    /* カード内訳 */
    .source-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .source-chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .chip-ai     { background: #e8f0ff; color: #1A5CB5; }
    .chip-manual { background: #e8f8ee; color: #27AE60; }
    .chip-unk    { background: #f5f5f5; color: #888; }

    /* リンク・ボタン */
    a { color: #2A6DB5; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .reload-btn {
      background: #2A6DB5; color: white; border: none;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      font-size: 12px; margin-left: 10px;
    }
    .expand-icon { font-size: 12px; transition: transform .2s; display: inline-block; }
    .expand-icon.open { transform: rotate(90deg); }
    .del-btn {
      background: none; color: #c0392b; border: 1px solid #c0392b;
      padding: 2px 8px; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: bold;
    }
    .del-btn:hover { background: #c0392b; color: white; }
    .danger-btn {
      background: #c0392b; color: white; border: none;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      font-size: 12px; font-weight: bold;
    }
    .danger-btn:hover { background: #96281b; }
    .danger-btn.light {
      background: none; color: #c0392b; border: 1.5px solid #c0392b;
    }
    .danger-btn.light:hover { background: #c0392b; color: white; }
  </style>
</head>
<body>
<header>
  <h1>GraRec</h1>
  <span>管理画面 — セッション一覧</span>
</header>
<main>
  <!-- 一括ダウンロード -->
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;padding:14px 18px;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);">
    <strong style="font-size:13px;">一括ダウンロード：</strong>
    <a href="/api/download_all_zip" style="text-decoration:none;">
      <button class="reload-btn" style="background:#1565c0;color:#fff;padding:6px 14px;">
        📦 全データをZIPでダウンロード
      </button>
    </a>
    <button class="reload-btn" style="background:#37474f;color:#fff;padding:6px 14px;" onclick="showRecordings()">
      🎙 録音ファイル一覧
    </button>
    <span style="font-size:11px;color:#888;">セッションJSON・タイムラプス・録音ファイルをまとめてダウンロードします</span>
  </div>

  <!-- 一括削除（テストデータリセット用） -->
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;padding:14px 18px;background:#fff5f5;border:1.5px solid #e8c0c0;border-radius:10px;">
    <strong style="font-size:13px;color:#c0392b;">⚠️ データ削除：</strong>
    <button class="danger-btn light" onclick="deleteAllData(false)">
      🗑 セッション・プロジェクトを削除
    </button>
    <button class="danger-btn" onclick="deleteAllData(true)">
      🗑 録音・タイムラプスも含めて全削除
    </button>
    <span style="font-size:11px;color:#c0392b;">実験前のテストデータ消去用。操作は取り消せません。</span>
  </div>

  <!-- 面談セッション -->
  <h2>
    🤝 面談セッション（/mendan）
    <button class="reload-btn" onclick="loadMendanSessions()">↺ 更新</button>
  </h2>
  <div id="mendan-status">読み込み中…</div>
  <table id="mendan-tbl" style="display:none">
    <thead>
      <tr>
        <th style="width:16px;"></th>
        <th>担当者</th>
        <th>タイトル</th>
        <th>AI支援</th>
        <th>カード数</th>
        <th>時間(推定)</th>
        <th>保存日時</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="mendan-tbody"></tbody>
  </table>

  <h2 style="margin-top:32px;">
    ⚛️ 量子力学実験セッション
    <button class="reload-btn" onclick="loadSessions()">↺ 更新</button>
  </h2>
  <div id="status">読み込み中…</div>
  <table id="tbl" style="display:none">
    <thead>
      <tr>
        <th style="width:16px;"></th>
        <th>班</th>
        <th>タイトル</th>
        <th>フェーズ</th>
        <th>AI支援</th>
        <th>カード数</th>
        <th>時間(推定)</th>
        <th>発話</th>
        <th>保存日時</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <!-- 班別プロジェクト履歴（/quantum 授業用） -->
  <h2 style="margin-top:32px;">
    ⚛️ 班別プロジェクト（量子力学授業）
    <button class="reload-btn" onclick="loadProjects()">↺ 更新</button>
  </h2>
  <div id="proj-status">読み込み中…</div>
  <table id="proj-tbl" style="display:none">
    <thead>
      <tr>
        <th style="width:16px;"></th>
        <th>班</th>
        <th>最終フェーズ</th>
        <th>カード数</th>
        <th>話し合い回数</th>
        <th>最終更新</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="proj-tbody"></tbody>
  </table>
</main>
<script>
const SPEAKER_COLORS = [
  '#4A90D9','#E85D5D','#27AE60','#F0A030',
  '#9B59B6','#16A085','#E67E22','#2C3E50'
];

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} `
       + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function phaseLabel(p) {
  const map = {
    saguru:'①さぐる', kizuku:'②きづく', hirameku:'③ひらめく',
    tsukuru:'④つくる', tamesu:'⑤ためす',
    minutes:'議事録', interview:'面談', custom:'カスタム'
  };
  return map[p] || p || '—';
}

function speakerMini(summary) {
  if (!summary || summary.length === 0) return '—';
  const total = summary.reduce((a, b) => a + (b.duration || 0), 0);
  const segs = summary.map((s, i) => {
    const pct = total > 0 ? (s.duration / total * 100).toFixed(1) : 0;
    return `<div class="spk-seg" style="width:${pct}%;background:${SPEAKER_COLORS[i%SPEAKER_COLORS.length]};"
                 title="${s.speaker}: ${pct}%"></div>`;
  }).join('');
  return `<div class="spk-bar">${segs}</div>`;
}

function miniBarList(obj, maxVal, colorFn) {
  if (!obj || Object.keys(obj).length === 0) return '<span style="color:#aaa;font-size:11px;">データなし</span>';
  return Object.entries(obj)
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => `
      <div class="mini-bar-row">
        <span class="mini-bar-label" title="${k}">${k}</span>
        <div class="mini-bar-track">
          <div class="mini-bar-fill" style="width:${Math.round(v/maxVal*100)}%;background:${colorFn(k)};"></div>
        </div>
        <span class="mini-bar-num">${v}</span>
      </div>`).join('');
}

function timelineChart(tl) {
  if (!tl || tl.length === 0) return '<span style="color:#aaa;font-size:11px;">タイムスタンプなし（古いセッション）</span>';
  const maxC = Math.max(...tl.map(t => t.count));
  return tl.map(t => `
    <div class="mini-bar-row">
      <span class="mini-bar-label">${t.bucket}</span>
      <div class="mini-bar-track">
        <div class="mini-bar-fill" style="width:${Math.round(t.count/maxC*100)}%;background:#27AE60;"></div>
      </div>
      <span class="mini-bar-num">${t.count}</span>
    </div>`).join('');
}

function esc(s) { return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function buildDetailPanel(s) {
  // エリア分布
  const areaDist = s.area_distribution || {};
  const areaMax  = Math.max(1, ...Object.values(areaDist));
  const areaHtml = miniBarList(areaDist, areaMax, () => '#4A90D9');

  // カード内訳
  const aiC  = s.ai_count      ?? 0;
  const mnC  = s.manual_count  ?? 0;
  const unkC = s.unknown_count ?? 0;
  const sourceHtml = `
    <div class="source-row">
      <span class="source-chip chip-ai">✨ AI: ${aiC}枚</span>
      <span class="source-chip chip-manual">🖊 手動: ${mnC}枚</span>
      ${unkC ? `<span class="source-chip chip-unk">?: ${unkC}枚</span>` : ''}
    </div>
    <p style="font-size:11px;color:#888;margin-top:6px;">
      ※「?」は旧セッション（フラグなし）のカードです。
    </p>`;

  // タイムライン
  const tlHtml = timelineChart(s.card_timeline || []);

  return `
    <div class="detail-block">
      <h4>📍 エリア別カード分布</h4>
      ${areaHtml}
    </div>
    <div class="detail-block">
      <h4>🃏 カード内訳 &amp; セッション時間</h4>
      ${sourceHtml}
      <p style="margin-top:10px;font-size:12px;color:#333;">
        ⏱ 推定時間：${s.duration_min != null ? s.duration_min + ' 分' : '不明（タイムスタンプなし）'}
      </p>
      <p style="font-size:11px;color:#888;">
        （オンボーディング完了〜最終保存の差）
      </p>
    </div>
    <div class="detail-block">
      <h4>📈 カード追加タイムライン（5分刻み）</h4>
      ${tlHtml}
    </div>`;
}

async function loadMendanSessions() {
  document.getElementById('mendan-status').textContent = '読み込み中…';
  document.getElementById('mendan-tbl').style.display = 'none';
  try {
    const res = await fetch('/api/list_sessions?type=mendan');
    if (res.status === 401) {
      document.getElementById('mendan-status').textContent = '認証エラー。ページをリロードしてください。';
      return;
    }
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    const tbody = document.getElementById('mendan-tbody');
    tbody.innerHTML = '';

    if (data.sessions.length === 0) {
      document.getElementById('mendan-status').textContent =
        '面談セッションはまだありません（/mendan からアクセスすると作成されます）。';
      return;
    }

    data.sessions.forEach((s, idx) => {
      const detailId = `mendan-detail-${idx}`;
      const iconId   = `mendan-icon-${idx}`;
      const aiLabel  = s.ai_support === false
        ? '<span style="color:#888;">📝 なし</span>'
        : '<span style="color:#1A5CB5;font-weight:bold;">✨ あり</span>';
      const durLabel = s.duration_min != null ? `${s.duration_min}分` : '—';

      const tr = document.createElement('tr');
      tr.className = 'data-row';
      tr.innerHTML = `
        <td><span class="expand-icon" id="${iconId}">▶</span></td>
        <td>${esc(s.operator_name || '—')}</td>
        <td>${esc(s.title) || '（タイトルなし）'}</td>
        <td>${aiLabel}</td>
        <td style="text-align:center;">${s.note_count}</td>
        <td style="text-align:center;">${durLabel}</td>
        <td style="white-space:nowrap;">${fmtDate(s.saved_at)}</td>
        <td>
          <a href="/review?session=${encodeURIComponent(s.session_id)}" target="_blank">振り返り</a>
          ／
          <button class="del-btn" style="background:#1565c0;color:#fff;" data-sid="${esc(s.session_id)}" onclick="showTimelapse(this, event)">タイムラプス</button>
          ／
          <a href="/api/download_timelapse_zip/${encodeURIComponent(s.session_id)}" onclick="event.stopPropagation()">
            <button class="del-btn" style="background:#1976d2;color:#fff;">ZIP</button>
          </a>
          ／
          <button class="del-btn" style="background:#37474f;color:#fff;" data-sid="${esc(s.session_id)}" onclick="showRecordingsForSession(this, event)">録音</button>
          ／
          <button class="del-btn" data-sid="${esc(s.session_id)}" onclick="deleteSession(this, event)">削除</button>
        </td>`;
      tbody.appendChild(tr);

      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.innerHTML = `
        <td colspan="8">
          <div class="detail-panel" id="${detailId}">
            ${buildDetailPanel(s)}
          </div>
        </td>`;
      tbody.appendChild(detailTr);

      tr.addEventListener('click', () => {
        const panel = document.getElementById(detailId);
        const icon  = document.getElementById(iconId);
        const isOpen = panel.classList.toggle('open');
        icon.classList.toggle('open', isOpen);
      });
    });

    document.getElementById('mendan-status').textContent = `${data.sessions.length} 件の面談セッション`;
    document.getElementById('mendan-tbl').style.display = 'table';
  } catch(e) {
    document.getElementById('mendan-status').textContent = 'エラー: ' + e.message;
  }
}

async function loadSessions() {
  document.getElementById('status').textContent = '読み込み中…';
  document.getElementById('tbl').style.display = 'none';
  try {
    const res  = await fetch('/api/list_sessions?type=general');
    if (res.status === 401) {
      document.getElementById('status').textContent = '認証エラー。ページをリロードしてください。';
      return;
    }
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    if (data.sessions.length === 0) {
      document.getElementById('status').textContent = 'セッションはまだありません。';
      return;
    }

    data.sessions.forEach((s, idx) => {
      const detailId = `detail-${idx}`;
      const iconId   = `icon-${idx}`;

      // AI支援バッジ
      const aiLabel = s.ai_support === false
        ? '<span style="color:#888;">📝 なし</span>'
        : '<span style="color:#1A5CB5;font-weight:bold;">✨ あり</span>';

      // 時間
      const durLabel = s.duration_min != null
        ? `${s.duration_min}分` : '—';

      // メインデータ行
      const tr = document.createElement('tr');
      tr.className = 'data-row';
      tr.innerHTML = `
        <td><span class="expand-icon" id="${iconId}">▶</span></td>
        <td><span class="badge badge-group">班${s.group_number || '?'}</span></td>
        <td>${esc(s.title) || '（タイトルなし）'}</td>
        <td><span class="badge badge-phase">${phaseLabel(s.phase)}</span></td>
        <td>${aiLabel}</td>
        <td style="text-align:center;">${s.note_count}</td>
        <td style="text-align:center;">${durLabel}</td>
        <td>${speakerMini(s.speaker_summary)}</td>
        <td style="white-space:nowrap;">${fmtDate(s.saved_at)}</td>
        <td>
          <a href="/review?session=${encodeURIComponent(s.session_id)}" target="_blank">振り返り</a>
          ／
          <a href="/?session=${encodeURIComponent(s.session_id)}" target="_blank">GraRec</a>
          ／
          <button class="del-btn" style="background:#1565c0;color:#fff;" data-sid="${esc(s.session_id)}" onclick="showTimelapse(this, event)">タイムラプス</button>
          ／
          <a href="/api/download_timelapse_zip/${encodeURIComponent(s.session_id)}" onclick="event.stopPropagation()">
            <button class="del-btn" style="background:#1976d2;color:#fff;">ZIP</button>
          </a>
          ／
          <button class="del-btn" style="background:#37474f;color:#fff;" data-sid="${esc(s.session_id)}" onclick="showRecordingsForSession(this, event)">録音</button>
          ／
          <button class="del-btn" data-sid="${esc(s.session_id)}" onclick="deleteSession(this, event)">削除</button>
        </td>`;
      tbody.appendChild(tr);

      // 詳細展開行
      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.innerHTML = `
        <td colspan="10">
          <div class="detail-panel" id="${detailId}">
            ${buildDetailPanel(s)}
          </div>
        </td>`;
      tbody.appendChild(detailTr);

      // 展開 / 折りたたみ
      tr.addEventListener('click', () => {
        const panel = document.getElementById(detailId);
        const icon  = document.getElementById(iconId);
        const isOpen = panel.classList.toggle('open');
        icon.classList.toggle('open', isOpen);
      });
    });

    document.getElementById('status').textContent = `${data.sessions.length} 件のセッション`;
    document.getElementById('tbl').style.display = 'table';
  } catch(e) {
    document.getElementById('status').textContent = 'エラー: ' + e.message;
  }
}

async function deleteSession(btn, event) {
  event.stopPropagation(); // 行クリック（展開）をキャンセル
  const sid = btn.dataset.sid;
  if (!confirm(`セッション「${sid}」を削除しますか？\nこの操作は取り消せません。`)) return;
  try {
    const res = await fetch(`/api/delete_session/${encodeURIComponent(sid)}`, { method: 'DELETE' });
    if (res.status === 401) { alert('認証エラー。ページをリロードしてください。'); return; }
    const data = await res.json();
    if (!data.ok) { alert('削除失敗: ' + data.error); return; }
    // 該当の data-row と detail-row を DOM から除去
    const dataRow   = btn.closest('tr.data-row');
    const detailRow = dataRow?.nextElementSibling;
    dataRow?.remove();
    detailRow?.remove();
    // カウント更新
    const remaining = document.querySelectorAll('tr.data-row').length;
    document.getElementById('status').textContent = `${remaining} 件のセッション`;
  } catch(e) {
    alert('エラー: ' + e.message);
  }
}

loadSessions();
loadMendanSessions();

// ===== タイムラプス =====
async function showTimelapse(btn, event) {
  event.stopPropagation();
  const sid = btn.dataset.sid;
  const modal = document.getElementById('timelapse-modal');
  const grid  = document.getElementById('timelapse-grid');
  const title = document.getElementById('timelapse-title');
  title.textContent = `タイムラプス: ${sid}`;
  grid.innerHTML = '<div style="padding:16px;color:#888;">読み込み中…</div>';
  modal.style.display = 'flex';
  try {
    const res  = await fetch(`/api/list_timelapse/${encodeURIComponent(sid)}`);
    if (res.status === 401) { alert('認証エラー'); return; }
    const data = await res.json();
    if (!data.ok || !data.images.length) {
      grid.innerHTML = '<div style="padding:16px;color:#888;">スクリーンショットがまだありません。</div>';
      return;
    }
    grid.innerHTML = data.images.map(img => `
      <div style="text-align:center;">
        <img src="${img.url}" style="max-width:100%;border-radius:6px;border:1px solid #ddd;" loading="lazy" />
        <div style="font-size:11px;color:#888;margin-top:4px;">${img.timestamp}</div>
      </div>`).join('');
  } catch(e) {
    grid.innerHTML = `<div style="padding:16px;color:red;">エラー: ${e.message}</div>`;
  }
}

// ===== 録音ファイル一覧 =====
async function showRecordings() {
  const modal = document.getElementById('recordings-modal');
  const list  = document.getElementById('recordings-list');

  }
}

// ===== 班別プロジェクト履歴 =====
async function loadProjects() {
  document.getElementById('proj-status').textContent = '読み込み中…';
  document.getElementById('proj-tbl').style.display = 'none';
  try {
    const res  = await fetch('/api/list_projects');
    if (res.status === 401) {
      document.getElementById('proj-status').textContent = '認証エラー。ページをリロードしてください。';
      return;
    }
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    const tbody = document.getElementById('proj-tbody');
    tbody.innerHTML = '';

    if (data.projects.length === 0) {
      document.getElementById('proj-status').textContent =
        'プロジェクトデータはまだありません（/quantum からアクセスすると作成されます）。';
      return;
    }

    data.projects.forEach((p, idx) => {
      const detailId = `proj-detail-${idx}`;
      const iconId   = `proj-icon-${idx}`;
      const sessions = p.sessions || [];

      const tr = document.createElement('tr');
      tr.className = 'data-row';
      tr.innerHTML = `
        <td><span class="expand-icon" id="${iconId}">▶</span></td>
        <td><span class="badge badge-group">班${esc(p.group_number)}</span></td>
        <td><span class="badge badge-phase">${phaseLabel(p.phase)}</span></td>
        <td style="text-align:center;">${p.note_count}</td>
        <td style="text-align:center;">${sessions.length} 回</td>
        <td style="white-space:nowrap;">${fmtDate(p.updated_at)}</td>
        <td>
          <a href="/review?session=${encodeURIComponent(sessions.length ? sessions[sessions.length-1].session_id : '')}"
             target="_blank">最終回を見る</a>
          ／
          <button class="del-btn" data-gn="${esc(p.group_number)}" onclick="deleteProject(this, event)">削除</button>
        </td>`;
      tbody.appendChild(tr);

      // セッション履歴展開行
      const sessionRows = sessions.slice().reverse().map(s => `
        <div class="mini-bar-row" style="padding:4px 0; border-bottom:1px solid #eef0f4;">
          <span class="mini-bar-label" style="min-width:80px;">${s.date || '—'}</span>
          <span class="badge badge-phase" style="margin:0 8px;">${phaseLabel(s.phase_reached)}</span>
          <span style="font-size:11px;">${s.ai_support ? '✨ 支援あり' : '📝 支援なし'}</span>
          <span style="font-size:11px; color:#888; margin-left:8px;">${s.card_count}枚</span>
          <a href="/review?session=${encodeURIComponent(s.session_id)}"
             style="margin-left:auto; font-size:11px;" target="_blank">振り返り</a>
        </div>`).join('');

      const detailTr = document.createElement('tr');
      detailTr.className = 'detail-row';
      detailTr.innerHTML = `
        <td colspan="7">
          <div class="detail-panel" id="${detailId}">
            <div class="detail-block" style="grid-column:1/-1;">
              <h4>📅 話し合い履歴（新しい順）</h4>
              ${sessionRows || '<span style="color:#aaa;font-size:11px;">記録なし</span>'}
            </div>
          </div>
        </td>`;
      tbody.appendChild(detailTr);

      tr.addEventListener('click', () => {
        const panel = document.getElementById(detailId);
        const icon  = document.getElementById(iconId);
        const isOpen = panel.classList.toggle('open');
        icon.classList.toggle('open', isOpen);
      });
    });

    document.getElementById('proj-status').textContent = `${data.projects.length} 班のプロジェクト`;
    document.getElementById('proj-tbl').style.display = 'table';
  } catch(e) {
    document.getElementById('proj-status').textContent = 'エラー: ' + e.message;
  }
}

loadProjects();

async function deleteProject(btn, event) {
  event.stopPropagation();
  const gn = btn.dataset.gn;
  if (!confirm(`班${gn}のプロジェクトデータを削除しますか？\nこの操作は取り消せません。`)) return;
  try {
    const res = await fetch(`/api/delete_project/${encodeURIComponent(gn)}`, { method: 'DELETE' });
    if (res.status === 401) { alert('認証エラー。ページをリロードしてください。'); return; }
    const data = await res.json();
    if (!data.ok) { alert('削除失敗: ' + data.error); return; }
    const dataRow   = btn.closest('tr.data-row');
    const detailRow = dataRow?.nextElementSibling;
    dataRow?.remove();
    detailRow?.remove();
    const remaining = document.querySelectorAll('#proj-tbody tr.data-row').length;
    document.getElementById('proj-status').textContent = `${remaining} 班のプロジェクト`;
  } catch(e) {
    alert('エラー: ' + e.message);
  }
}

async function deleteAllData(includeMedia) {
  const target = includeMedia
    ? 'すべてのセッション・プロジェクト・録音・タイムラプスデータ'
    : 'すべてのセッション・プロジェクトデータ（録音・タイムラプスは残ります）';
  if (!confirm(`${target}を削除しますか？\nこの操作は取り消せません。`)) return;
  if (!confirm('本当に削除しますか？削除後に復元はできません。')) return;
  try {
    const res = await fetch('/api/delete_all_data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ include_media: includeMedia })
    });
    if (res.status === 401) { alert('認証エラー。ページをリロードしてください。'); return; }
    const data = await res.json();
    if (!data.ok) { alert('削除失敗: ' + (data.error || '不明なエラー')); return; }
    alert(`削除完了: ${data.deleted} ファイルを削除しました。`);
    loadSessions();
    loadMendanSessions();
    loadProjects();
  } catch(e) {
    alert('エラー: ' + e.message);
  }
}
